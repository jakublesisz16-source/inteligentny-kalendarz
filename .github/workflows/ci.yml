name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Channel identity and build contract
        run: npm run channel:contract

      - name: Build number monotonicity
        run: npm run channel:monotonicity

      - name: Release preflight
        run: npm run release:preflight

      - name: Channel repository safety
        run: |
          SURFACE="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('CHANNEL_BUILD_INFO.json','utf8')).surface)")"
          case "$SURFACE" in
            sync-preview) npm run security:sync-preview ;;
            public-stable) npm run security:public ;;
            *) echo "::error::Unknown channel surface: $SURFACE"; exit 1 ;;
          esac

      - name: Typecheck, public tests, production build and project gates
        run: npm run check:public

      - name: Production dependency audit
        run: npm run security:dependencies
