name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Release preflight
        run: npm run release:preflight

      - name: Public repository safety
        run: npm run security:public

      - name: Typecheck, public tests, production build and project gates
        run: npm run check:public

      - name: Production dependency audit
        run: npm run security:dependencies
