name: Materialize final release

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - ".release_payload/READY"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize and verify exact public artifact
        shell: bash
        run: |
          set -euo pipefail
          cat .release_payload/zip.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/IK_1.0.0_PUBLIC.zip
          echo "5a8737e30333b8022be837447e88847056905a3ece0b01b32e5ea64d513f9097  /tmp/IK_1.0.0_PUBLIC.zip" | sha256sum -c -

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          unzip -q /tmp/IK_1.0.0_PUBLIC.zip -d .

          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 189
          test ! -e _PRIVATE_HISTORY
          test ! -e worker
          test ! -e wrangler.jsonc
          test ! -e .env.example
          test ! -e .dev.vars.example
          test ! -e .release_payload
          test ! -e .github/workflows/materialize-release.yml
          grep -q '"version": "1.0.0"' package.json
          grep -q "APP_VERSION = '1.0.0'" src/core/version.ts
          grep -q 'DATABASE_SCHEMA_VERSION = 12' src/core/version.ts
          grep -q 'inteligentny-kalendarz-shell-v1.0.0' public/service-worker.js

          npm ci
          npm run check
          npm audit --audit-level=high

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 1.0.0"
          git push origin HEAD:release/1.0.0
