name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Public typecheck
        run: npm run typecheck
      - name: Public tests
        run: >-
          npx vitest run
          --exclude src/tests/receipt-ocr-b029a-benchmark.test.ts
          --exclude src/tests/receipt-ocr-dev4a-gate1-fix2-candidate-safety.test.ts
          --exclude src/tests/receipt-ocr-dev4a-gate1-recovery1-value-column.test.ts
          --exclude src/tests/receipt-ocr-dev4a-gate2-ab-validation.test.ts
          --exclude src/tests/receipt-ocr-dev4a-gate3-production-selector.test.ts
          --exclude src/tests/receipt-ocr-dev4b-fix1-structured-geometry-selection.test.ts
          --exclude src/tests/receipt-ocr-dev4b-fix2-local-numeric-verification.test.ts
      - name: Production build and release gates
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
