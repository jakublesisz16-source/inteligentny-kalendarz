name: Deploy Sync Preview to Firebase

on:
  push:
    branches: ["feature/cloud-sync-poc"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-sync-preview
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate channel identity
        run: npm run channel:contract

      - name: Validate build monotonicity
        run: npm run channel:monotonicity

      - name: Validate Sync Preview package surface
        run: npm run security:sync-preview

      - name: Typecheck, public tests, production build and project gates
        run: npm run check:public

      - name: Verify Firebase deploy credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELIGENTNY_KALENDARZ_S_2CFC9 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_INTELIGENTNY_KALENDARZ_S_2CFC9"
            exit 1
          fi

      - name: Use staging Firebase config
        run: cp firebase.sync-lab.json firebase.json

      - name: Deploy exact checked commit to staging Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTELIGENTNY_KALENDARZ_S_2CFC9 }}
          projectId: inteligentny-kalendarz-s-2cfc9
          channelId: live
